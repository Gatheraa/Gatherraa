version: '3.8'
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:9.5.0
    environment:
      # Credentials are injected from the shell/.env. The defaults are
      # development-only and the startup entrypoint refuses to run with a weak
      # default password outside GRAFANA_DEV_ONLY=true (see
      # ./grafana/entrypoint.sh and .env.example).
      - GRAFANA_DEV_ONLY=${GRAFANA_DEV_ONLY:-true}
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    entrypoint:
      - /etc/grafana/entrypoint.sh
      - --homepath=/usr/share/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
    ports:
      - '3000:3000'
    volumes:
      - ./grafana/entrypoint.sh:/etc/grafana/entrypoint.sh:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  loki:
    image: grafana/loki:2.9.2
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki:/etc/loki:ro

  promtail:
    image: grafana/promtail:2.9.2
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml

  jaeger:
    image: jaegertracing/all-in-one:1.49
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ':9411'
    ports:
      - '16686:16686' # UI
      - '14268:14268' # collector (http)
      - '14250:14250' # jaeger gRPC
      - '4317:4317'   # OpenTelemetry OTLP gRPC receiver
      - '4318:4318'   # OpenTelemetry OTLP HTTP receiver

volumes: {}
